server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve generated JSON from the backend analysis volume
    location = /data.json {
        alias /data/data.json;
        add_header Cache-Control "no-cache";
    }

    location = /dfa_data.json {
        alias /data/dfa_data.json;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
