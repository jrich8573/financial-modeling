services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finmodels
      POSTGRES_PASSWORD: __DB_PASSWORD__
      POSTGRES_DB: financial_models
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finmodels -d financial_models"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    image: ghcr.io/jrich8573/financial-modeling/backend:latest
    restart: on-failure
    environment:
      DATABASE_URL: postgres://finmodels:__DB_PASSWORD__@db:5432/financial_models
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - analysis_data:/app/web/public
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    image: ghcr.io/jrich8573/financial-modeling/web:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - analysis_data:/data
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
  analysis_data:
