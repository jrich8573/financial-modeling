services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finmodels
      POSTGRES_PASSWORD: finmodels
      POSTGRES_DB: financial_models
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finmodels -d financial_models"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://finmodels:finmodels@db:5432/financial_models
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - analysis_data:/app/web/public

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
      - "8080:80"
    volumes:
      # Mount the backend's JSON output for nginx to serve
      - analysis_data:/data
    depends_on:
      - backend

volumes:
  pgdata:
  analysis_data:
